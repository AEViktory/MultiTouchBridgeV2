plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.ae.multitouchbridge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ae.multitouchbridge'
        minSdk 30
        targetSdk 33
        versionCode 21
        versionName '2.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
