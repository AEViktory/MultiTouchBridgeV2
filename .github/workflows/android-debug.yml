name: Android Debug Build

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; ls -R "$ANDROID_HOME/cmdline-tools" 2>/dev/null | head -n 20; exit 1; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        run: gradle --no-daemon --max-workers=1 assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
